name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: ./gradlew assemble -x test

      - name: Upload HMCL jar
        uses: actions/upload-artifact@v4
        with:
          name: HMCL-jar
          path: HMCL/build/libs/*.jar
          retention-days: 7

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build (JAR + EXE)
        run: gradle :HMCL:build -x test --no-daemon

      - name: Upload HMCL jar
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: HMCL-fat-jar
          path: HMCL/build/libs/*.jar
          retention-days: 7

      - name: Upload HMCL Windows launcher
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: HMCL-windows-launcher
          path: HMCL/build/scripts/*.bat
          retention-days: 7

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build JAR
        run: gradle :HMCL:build -x test --no-daemon

      - name: Find JAR
        id: jar
        run: |
          JAR=$(find . -path '*/HMCL/build/libs/*.jar' -type f | head -1)
          echo "Found JAR: $JAR"
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Overworld-Launcher-${{ github.run_number }}
          path: HMCL/build/libs/*.jar
          retention-days: 7

      - name: Commit artifact to Releases
        if: success()
        run: |
          RELEASE_DIR="Releases/run-${{ github.run_number }}"
          mkdir -p "$RELEASE_DIR"
          cp HMCL/build/libs/*.jar "$RELEASE_DIR/"
          git add Releases/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: build artifact for run #${{ github.run_number }}"
          git push

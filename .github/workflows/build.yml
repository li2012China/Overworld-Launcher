name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Install Wine for jpackage
        run: sudo apt-get update && sudo apt-get install -y wine64

      - name: Build HMCL JAR
        run: gradle :HMCL:build -x test --no-daemon

      - name: Build EXE with jpackage
        run: |
          JAR=$(ls HMCL/build/libs/*.jar | head -1)
          jpackage \
            --input "$(dirname $JAR)" \
            --main-jar "$(basename $JAR)" \
            --name HMCL \
            --dest HMCL/build/libs \
            --java-options "-Xms256m" \
            --java-options "-Xmx1024m" \
            --app-version "${{ github.run_number }}" \
            --vendor "Hello Minecraft" \
            --description "Hello Minecraft! Launcher"

      - name: Upload HMCL jar
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: HMCL-fat-jar
          path: HMCL/build/libs/*.jar
          retention-days: 7

      - name: Upload HMCL EXE
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: HMCL-windows-exe
          path: HMCL/build/libs/HMCL
          retention-days: 7
